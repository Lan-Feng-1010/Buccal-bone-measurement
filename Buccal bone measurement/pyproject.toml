[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postop-cbct-geometry"
version = "0.3.0"
description = "Postoperative measurement directly from existing 3-D CBCT segmentations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "nibabel>=5.2,<6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
postop-cbct = "postop_cbct.cli:main"

[tool.setuptools.packages.find]
include = ["postop_cbct*"]
